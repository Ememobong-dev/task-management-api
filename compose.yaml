services:
  postgres:
    image: postgres:17-alpine
    container_name: task-management-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: task_user
      POSTGRES_PASSWORD: task_password
      POSTGRES_DB: task_management_db

    ports:
      - '5432:5432'

    volumes:
      - task_management_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U task_user -d task_management_db',
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  migrate:
    build:
      context: .
      target: builder

    environment:
      DATABASE_URL: postgresql://task_user:task_password@postgres:5432/task_management_db?schema=public

    depends_on:
      postgres:
        condition: service_healthy

    command: npx prisma migrate deploy

    restart: 'no'


  app:
    build:
      context: .
      target: runner

    container_name: task-management-api
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://task_user:task_password@postgres:5432/task_management_db?schema=public

    ports:
      - '3000:3000'

    depends_on:
      postgres:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully


volumes:
  task_management_postgres_data:


